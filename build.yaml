description: >
  Add, rename, delete and browse People on any Jellyfin item, including
  Photos and Videos that don't natively support People. Includes a
  gallery view and orphan cleanup tools.

  Compatible with Jellyfin 10.11.x only. NOT tested or supported on
  Jellyfin 12.0+, which introduced a new database schema — this plugin
  writes directly to internal tables and may break on newer versions.
