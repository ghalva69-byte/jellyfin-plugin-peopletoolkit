name: '📦 Release Plugin'

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build --configuration Release Jellyfin.Plugin.PeopleToolkit

      - name: Zip plugin
        run: |
          cd Jellyfin.Plugin.PeopleToolkit/bin/Release/net9.0
          zip -r ../../../../peopletoolkit_${{ github.ref_name }}.zip Jellyfin.Plugin.PeopleToolkit.dll

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: peopletoolkit_${{ github.ref_name }}.zip

      - name: Generate/update manifest.json
        uses: matthewstrasiotto/jellyfin-plugin-repo-action@dev-working
        with:
          ignorePrereleases: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: manifest-release
          pagesFile: manifest.json